name: build-release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.2.3)"
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go-bedehus

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go-bedehus/go.mod
          cache: true

      - name: Build armv6 binaries
        run: make build-pi1

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bedehus-linux-armv6
          path: |
            go-bedehus/dist/bedehus-linux-armv6
            go-bedehus/dist/bedehus-on-linux-armv6
            go-bedehus/dist/bedehus-off-linux-armv6

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: ${{ inputs.tag || github.ref_name }}
          files: |
            go-bedehus/dist/bedehus-linux-armv6
            go-bedehus/dist/bedehus-on-linux-armv6
            go-bedehus/dist/bedehus-off-linux-armv6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
