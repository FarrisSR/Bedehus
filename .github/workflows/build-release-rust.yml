name: build-release-rust

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.2.3)"
        required: true
        type: string

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust-bedehus
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-bedehus

      - name: Run tests
        run: cargo test

      - name: Clippy
        run: cargo clippy -- -D warnings

  build-armv6:
    name: Build armv6
    runs-on: ubuntu-latest
    needs: test
    defaults:
      run:
        working-directory: rust-bedehus
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-bedehus

      - name: Install cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Build armv6 binary
        run: cross build --release --target arm-unknown-linux-musleabihf

      - name: Stage artifact
        run: |
          mkdir -p dist
          cp target/arm-unknown-linux-musleabihf/release/bedehus-rs dist/bedehus-rs-linux-armv6

      - name: Install QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user-static

      - name: Smoke test binary
        run: qemu-arm-static dist/bedehus-rs-linux-armv6 --help

      - name: Checksum
        run: |
          cd dist
          sha256sum bedehus-rs-linux-armv6 > bedehus-rs-linux-armv6.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: bedehus-rs-linux-armv6
          path: |
            rust-bedehus/dist/bedehus-rs-linux-armv6
            rust-bedehus/dist/bedehus-rs-linux-armv6.sha256

  build-amd64:
    name: Build amd64
    runs-on: ubuntu-latest
    needs: test
    defaults:
      run:
        working-directory: rust-bedehus
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          target: x86_64-unknown-linux-gnu

      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-bedehus

      - name: Build amd64 binary
        run: cargo build --release --target x86_64-unknown-linux-gnu

      - name: Stage artifact
        run: |
          mkdir -p dist
          cp target/x86_64-unknown-linux-gnu/release/bedehus-rs dist/bedehus-rs-linux-amd64

      - name: Smoke test binary
        run: dist/bedehus-rs-linux-amd64 --help

      - name: Checksum
        run: |
          cd dist
          sha256sum bedehus-rs-linux-amd64 > bedehus-rs-linux-amd64.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: bedehus-rs-linux-amd64
          path: |
            rust-bedehus/dist/bedehus-rs-linux-amd64
            rust-bedehus/dist/bedehus-rs-linux-amd64.sha256

  release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    needs: [build-armv6, build-amd64]
    steps:
      - name: Download armv6 artifact
        uses: actions/download-artifact@v7
        with:
          name: bedehus-rs-linux-armv6
          path: dist

      - name: Download amd64 artifact
        uses: actions/download-artifact@v7
        with:
          name: bedehus-rs-linux-amd64
          path: dist

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: ${{ inputs.tag || github.ref_name }}
          files: |
            dist/bedehus-rs-linux-armv6
            dist/bedehus-rs-linux-armv6.sha256
            dist/bedehus-rs-linux-amd64
            dist/bedehus-rs-linux-amd64.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
