name: build-release-rust

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.2.3)"
        required: true
        type: string

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust-bedehus
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-bedehus

      - name: Run tests
        run: cargo test

      - name: Clippy
        run: cargo clippy -- -D warnings

  build:
    name: Build armv6
    runs-on: ubuntu-latest
    needs: test
    defaults:
      run:
        working-directory: rust-bedehus
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-bedehus

      - name: Install cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Build armv6 binary
        run: cross build --release --target arm-unknown-linux-musleabihf

      - name: Stage artifact
        run: |
          mkdir -p dist
          cp target/arm-unknown-linux-musleabihf/release/bedehus-rs dist/bedehus-rs-linux-armv6

      - name: Install QEMU
        run: sudo apt-get install -y qemu-user-static

      - name: Smoke test binary
        run: qemu-arm-static dist/bedehus-rs-linux-armv6 --help

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bedehus-rs-linux-armv6
          path: rust-bedehus/dist/bedehus-rs-linux-armv6

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: ${{ inputs.tag || github.ref_name }}
          files: rust-bedehus/dist/bedehus-rs-linux-armv6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
