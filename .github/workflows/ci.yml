name: ci

on:
  push:
    branches: [master, glamox]
  pull_request:

jobs:
  go:
    name: Go vet
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go-bedehus
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go-bedehus/go.mod
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

  python:
    name: Python lint + test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: pip install -r requirements.txt pytest pip-audit

      - name: Compile check
        run: |
          python -m compileall -q \
            main.py systemd_main.py on.py off.py \
            glamox/ mill_controller/ sr201/ common/ scripts/

      - name: Test
        run: pytest tests/ -v

      - name: Audit dependencies
        run: pip-audit -r requirements.txt

  rust:
    name: Rust test + clippy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust-bedehus
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-bedehus

      - name: Test
        run: cargo test

      - name: Clippy
        run: cargo clippy -- -D warnings
