[package]
name = "bedehus-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"

[dependencies]
anyhow = "1.0.102"
chrono = { version = "0.4.45", features = ["clock", "serde"] }
chrono-tz = "0.10.4"
clap = { version = "4.6.1", features = ["derive"] }
plotters = { version = "0.3.7", default-features = false, features = ["ab_glyph", "chrono", "bitmap_backend", "bitmap_encoder", "line_series", "point_series"] }
rusqlite = { version = "0.39.0", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
signal-hook = "0.3"
jsonwebtoken = { version = "10.4.0", default-features = false, features = ["use_pem", "rust_crypto"] }
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "json", "form", "query", "rustls"] }
